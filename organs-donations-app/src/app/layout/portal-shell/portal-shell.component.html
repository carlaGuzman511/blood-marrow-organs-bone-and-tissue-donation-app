<div class="shell">
  <aside class="sidebar" aria-label="Navegación del portal">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><span class="material-symbols-outlined">water_drop</span></span>
      <div class="brand-text">
        <span class="vd-title-sm">Vitalis</span>
        <span class="vd-label-sm">Red DonaVida</span>
      </div>
    </div>

    <nav class="nav">
      @for (item of nav; track item.path) {
        <a class="nav-link vd-label-md" [routerLink]="item.path" routerLinkActive="nav-link--active"
           #rla="routerLinkActive" [attr.aria-current]="rla.isActive ? 'page' : null">
          <span class="material-symbols-outlined" aria-hidden="true">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      @if (sede(); as current) {
        <div class="sede-chip" data-testid="session-sede">
          <span class="material-symbols-outlined" aria-hidden="true">domain</span>
          <span class="vd-label-md sede-name" [title]="current.name">{{ current.name }}</span>
          <button type="button" class="sede-change vd-label-sm" (click)="changeSede()">Cambiar sede</button>
        </div>
      }
      <span class="spacer"></span>
      <div class="user">
        <div class="user-text">
          <span class="vd-label-md">{{ userName() }}</span>
          <span class="vd-label-sm vd-text-muted">{{ roleLabel() }}</span>
        </div>
        <span class="avatar" aria-hidden="true"><span class="material-symbols-outlined">person</span></span>
        <button type="button" class="icon-button" (click)="logout()" aria-label="Cerrar sesión" title="Cerrar sesión">
          <span class="material-symbols-outlined" aria-hidden="true">logout</span>
        </button>
      </div>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
