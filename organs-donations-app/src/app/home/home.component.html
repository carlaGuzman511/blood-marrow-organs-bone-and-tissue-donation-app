<button mat-button (click)="openDonationForm()">Agregar Solicitud</button>
<mat-spinner *ngIf="isLoading"></mat-spinner>
<app-card 
    [items]="donationPosts" 
    (removeItemEvent)="removeItem($event)" 
    (editItemEvent)="editItem($event)">
</app-card>
<button mat-button *ngIf="hasMore && !isLoading" (click)="loadMore()">Ver mas</button>
